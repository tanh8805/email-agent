[project]
name = "email-agent"
version = "0.1.0"
description = "Email agent: nhận email từ n8n, xử lý bằng LangGraph, lưu vào PostgreSQL"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "langgraph>=0.2",
    "langchain-anthropic>=0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
